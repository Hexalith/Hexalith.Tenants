<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tenants focus module browser validation</title>
    <link rel="stylesheet" href="./correction.css">
    <link id="page-stylesheet" rel="stylesheet" href="./global-admins.css">
    <style>#background-surface { position: fixed; inset: 0; z-index: 1; }</style>
</head>
<body>
    <section id="background-surface" aria-hidden="true"></section>
    <section id="correction-panel" class="ga-correction-panel">
        <fluent-button id="correction-retry" class="ga-correction-panel__mutation-initiation">Retry delivery</fluent-button>
        <button id="correction-status">Refresh status</button>
    </section>
    <section id="remove-preview" class="global-admins__remove-preview" role="dialog" aria-modal="true">
        <span id="remove-focus-start" tabindex="0"></span>
        <fluent-button id="tenants-global-admin-remove-cancel-button"
                       data-testid="tenants-global-admin-remove-cancel"
                       appearance="outline">Cancel</fluent-button>
        <input id="remove-acknowledgement" aria-label="Removal acknowledgement">
    </section>
    <section id="remove-lifecycle" tabindex="-1">Removal lifecycle</section>
    <output id="validation-report">RUNNING</output>
    <script type="module">
        const cancelButtonId = "tenants-global-admin-remove-cancel-button";
        const parameters = new URLSearchParams(window.location.search);
        const modulePath = parameters.get("module") ?? "./tenantsFocus.js";
        const pageCssPath = parameters.get("css") ?? "./global-admins.css";
        if (pageCssPath !== "./global-admins.css") {
            const stylesheet = document.getElementById("page-stylesheet");
            await new Promise((resolve, reject) => {
                stylesheet.addEventListener("load", resolve, { once: true });
                stylesheet.addEventListener("error", reject, { once: true });
                stylesheet.href = pageCssPath;
            });
        }
        const fluentUi = await import("./fluent-ui.js");
        fluentUi.beforeStart(document, "web");
        await customElements.whenDefined("fluent-button");
        const { focusElementById } = await import(modulePath);
        const report = document.getElementById("validation-report");
        const acknowledgement = document.getElementById("remove-acknowledgement");
        const lifecycle = document.getElementById("remove-lifecycle");
        const startSentinel = document.getElementById("remove-focus-start");
        const observations = [];

        function assertActiveElement(expected, scenario) {
            const actual = document.activeElement;
            observations.push(`${scenario}:${actual?.id ?? "none"}`);
            if (actual !== expected) {
                throw new Error(`${scenario} expected ${expected.id} but focused ${actual?.id ?? "none"}`);
            }
        }

        function routeStartSentinel() {
            const preview = document.getElementById("remove-preview");
            if (!preview) {
                lifecycle.focus({ preventScroll: false });
                return;
            }

            if (!focusElementById(cancelButtonId)) {
                acknowledgement.focus({ preventScroll: false });
            }
        }

        startSentinel.addEventListener("focus", routeStartSentinel);

        try {
            const correctionCss = await (await fetch("./correction.css")).text();
            const pageCss = await (await fetch(pageCssPath)).text();
            const pageScope = pageCss.match(/\.global-admins__remove-preview\[([a-z0-9-]+)\]/)?.[1];
            if (!pageScope) {
                throw new Error("remove-dialog-style: compiled page CSS scope missing");
            }
            const preview = document.getElementById("remove-preview");
            preview.setAttribute(pageScope, "");
            await document.fonts.ready;
            const previewStyle = getComputedStyle(preview);
            const previewBounds = preview.getBoundingClientRect();
            const previewCenter = document.elementFromPoint(
                previewBounds.left + previewBounds.width / 2,
                previewBounds.top + previewBounds.height / 2);
            if (previewStyle.display === "none"
                || previewStyle.visibility !== "visible"
                || Number(previewStyle.opacity) === 0
                || previewStyle.position !== "fixed"
                || previewStyle.boxSizing !== "border-box"
                || previewStyle.overflowY !== "auto"
                || Number(previewStyle.zIndex) <= 1
                || previewBounds.width <= 0
                || previewBounds.height <= 0
                || previewBounds.left < -1
                || previewBounds.top < -1
                || previewBounds.right > window.innerWidth + 1
                || previewBounds.bottom > window.innerHeight + 1
                || !preview.contains(previewCenter)) {
                throw new Error(`remove-dialog-style: visible fixed foreground bounds required; display=${previewStyle.display};position=${previewStyle.position};bounds=${previewBounds.toJSON()}`);
            }
            observations.push("remove-dialog-computed-fixed-visible-bounded-foreground");

            const scope = correctionCss.match(/\.ga-correction-panel__mutation-initiation\[([a-z0-9-]+)\]/)?.[1];
            if (!scope || window.innerWidth > 767) {
                throw new Error(`correction CSS scope or narrow viewport missing: ${scope ?? "none"};${window.innerWidth}`);
            }
            document.getElementById("correction-panel").setAttribute(scope, "");
            await document.fonts.ready;
            const retry = document.getElementById("correction-retry");
            if (!retry.isConnected || getComputedStyle(retry).display !== "none"
                || getComputedStyle(document.getElementById("correction-status")).display === "none") {
                throw new Error("mounted correction retry must be hidden while read-only status remains visible");
            }
            observations.push("narrow-correction-retry-hidden");

            startSentinel.focus();
            const exactCancel = document.getElementById(cancelButtonId);
            assertActiveElement(exactCancel, "start-to-exact-cancel");

            exactCancel.setAttribute("disabled", "");
            startSentinel.focus();
            assertActiveElement(acknowledgement, "existing-unfocusable-cancel-to-acknowledgement");

            exactCancel.remove();
            startSentinel.focus();
            assertActiveElement(acknowledgement, "missing-cancel-to-acknowledgement");

            document.getElementById("remove-preview").remove();
            routeStartSentinel();
            assertActiveElement(lifecycle, "missing-preview-to-lifecycle");

            document.documentElement.dataset.validationStatus = "passed";
            report.textContent = `PASS ${observations.join(";")}`;
        }
        catch (error) {
            document.documentElement.dataset.validationStatus = "failed";
            report.textContent = `FAIL ${error instanceof Error ? error.message : String(error)};${observations.join(";")}`;
        }
    </script>
</body>
</html>
