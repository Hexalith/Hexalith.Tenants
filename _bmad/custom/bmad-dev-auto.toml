# Team overrides for bmad-dev-auto.
# Committed to the repo — applies to every developer on the project.
#
# dev-auto is an independent completion path: it does not invoke bmad-dev-story
# and never runs that skill's Definition of Done. Without this file the
# submodule pointer guard would not run on the unattended lane at all.
#
# dev-auto also does not record a baseline of its own, so the activation step
# below captures one before any work starts.

[workflow]

activation_steps_prepend = [
  "Run `git rev-parse HEAD` and hold the result as this run's gitlink baseline. As soon as the spec file is known, if its frontmatter has no `baseline_commit`, add `baseline_commit: <that SHA>` to it. Capture this BEFORE any implementation work — a baseline taken mid-run silently narrows the diff and hides drift that landed earlier.",
]

persistent_facts = [
  "A change must not move a `references/` submodule pointer silently. Before setting a spec `status: done`, run `python3 scripts/validate-story-gitlinks.py <spec-file>` and resolve every UNDECLARED entry by declaring it (File List entry + reason) or reverting it to the baseline SHA.",
  "Never write that `references/` was untouched, unchanged, or left alone unless `scripts/validate-story-gitlinks.py` exited 0. Stories 1.4 (`41e047e`) and 1.6 (`ec7ec8c`) both made that claim while their commits moved gitlinks.",
]

on_complete = """
Run the submodule pointer declaration check against this run's spec file:

  python3 scripts/validate-story-gitlinks.py <spec-file>

- Exit 0 — continue.
- Exit 1 — do NOT leave the spec at `status: done`. For each UNDECLARED entry,
  either declare the path (File List entry plus the reason it belongs to this
  change) or run the printed `git checkout <sha> -- <path>` and land the bump
  separately as `build(deps): bump <module> submodule`. Re-run until it exits 0.
- FAIL with no `baseline_commit` means the activation step did not record one.
  Report that as the blocker rather than inventing a baseline after the fact.

Report the verdict in the run result.
"""
