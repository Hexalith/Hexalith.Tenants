name: Story Guards

# Regression lane for the repository-owned story guards under `scripts/`.
#
# The main CI workflow delegates wholesale to the shared `Hexalith.Builds` reusable
# workflow, which knows nothing about this repository's Python tooling. Adding the
# lane there would mean changing a shared module for a Tenants-owned concern, so it
# lives here instead.
#
# Decision D-K (review loop 13) reversed the earlier position that manual executable
# verification was sufficient for `validate-story-gitlinks.py`. A guard whose failure
# mode is a silent PASS on an undeclared submodule bump needs its own regression floor.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: story-guards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitlink-guard:
    name: validate-story-gitlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the gitlink guard regression lane
        run: python3 tests/scripts/test_validate_story_gitlinks.py

  remove-focus-browser-guard:
    name: validate-remove-focus-in-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize root-declared submodules
        run: git -c submodule.recurse=false submodule update --init
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore the UI browser-validation graph
        run: >
          dotnet restore tests/Hexalith.Tenants.UI.Tests/Hexalith.Tenants.UI.Tests.csproj
          -m:1 -nr:false
      - name: Build the UI browser-validation graph
        run: >
          dotnet build tests/Hexalith.Tenants.UI.Tests/Hexalith.Tenants.UI.Tests.csproj
          --configuration Release --no-restore -warnaserror -m:1 -nr:false
      - name: Validate the shipped removal focus module in Chromium
        run: tests/Hexalith.Tenants.UI.Tests/Browser/validate-tenants-focus-browser.sh
