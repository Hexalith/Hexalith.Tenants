name: Story Guards

# Regression lane for the repository-owned story guards under `scripts/`.
#
# The main CI workflow delegates wholesale to the shared `Hexalith.Builds` reusable
# workflow, which knows nothing about this repository's Python tooling. Adding the
# lane there would mean changing a shared module for a Tenants-owned concern, so it
# lives here instead.
#
# Decision D-K (review loop 13) reversed the earlier position that manual executable
# verification was sufficient for `validate-story-gitlinks.py`. A guard whose failure
# mode is a silent PASS on an undeclared submodule bump needs its own regression floor.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: story-guards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitlink-guard:
    name: validate-story-gitlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Validate changed story gitlinks
        run: python3 scripts/validate-changed-story-gitlinks.py

      - name: Run the changed-story CI regression lane
        if: ${{ !cancelled() }}
        run: python3 tests/scripts/test_validate_changed_story_gitlinks.py

      - name: Run the gitlink guard regression lane
        if: ${{ !cancelled() }}
        run: python3 tests/scripts/test_validate_story_gitlinks.py

      - name: Run the pushall attachment gate regression lane
        if: ${{ !cancelled() }}
        run: python3 tests/scripts/test_pushall_detached_head.py

      - name: Run the pushall remote default regression lane
        if: ${{ !cancelled() }}
        run: python3 tests/scripts/test_pushall_default_branch.py

      - name: Run the BMAD customization resolver regression lane
        if: ${{ !cancelled() }}
        run: python3 tests/scripts/test_resolve_customization.py

      - name: Run the elicitation catalog regression lane
        if: ${{ !cancelled() }}
        run: python3 tests/scripts/test_elicitation_numbers.py

      - name: Run the TEA enforcement regression lane
        if: ${{ !cancelled() }}
        run: python3 tests/scripts/test_tea_enforcement.py

      - name: Run bootstrap handoff shell safety checks
        if: ${{ !cancelled() }}
        run: python3 tests/scripts/test_bootstrap_handoff.py

  release-artifact-guards:
    name: validate-release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize shared OCI validator
        run: git -c submodule.recurse=false submodule update --init references/Hexalith.Builds
      - name: Qualify release destination and package boundaries
        run: >
          python3 -m unittest discover -s tests/scripts
          -p 'test_*release*.py'
      - name: Qualify restore dependency ranges and frameworks
        run: python3 tests/scripts/test_nuget_dependency_ranges.py

  remove-focus-browser-guard:
    name: validate-remove-focus-in-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_FOR_TESTING_VERSION: 153.0.8010.52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize root-declared submodules
        run: git -c submodule.recurse=false submodule update --init
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore the UI browser-validation graph
        run: >
          dotnet restore tests/Hexalith.Tenants.UI.Tests/Hexalith.Tenants.UI.Tests.csproj
          -m:1 -nr:false
      - name: Build the UI browser-validation graph
        run: >
          dotnet build tests/Hexalith.Tenants.UI.Tests/Hexalith.Tenants.UI.Tests.csproj
          --configuration Release --no-restore -warnaserror -m:1 -nr:false
      - name: Install Chrome for the removal focus validator
        id: chrome
        uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
        with:
          chrome-version: ${{ env.CHROME_FOR_TESTING_VERSION }}
      - name: Install the matching Chrome headless shell
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CHROME_FOR_TESTING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "CHROME_FOR_TESTING_VERSION must be a four-part Chrome for Testing version." >&2
            exit 1
          fi
          archive_dir="${RUNNER_TEMP}/chrome-headless-shell"
          mkdir -p "$archive_dir"
          curl --fail --silent --show-error --location \
            --output "$archive_dir/chrome-headless-shell.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-headless-shell-linux64.zip"
          unzip -q "$archive_dir/chrome-headless-shell.zip" -d "$archive_dir"
          shell_path="$archive_dir/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$shell_path" ]]; then
            echo "Chrome headless shell was not installed at ${shell_path}." >&2
            exit 1
          fi
          "$shell_path" --version
          echo "TENANTS_HEADLESS_SHELL=${shell_path}" >> "$GITHUB_ENV"
      - name: Validate the shipped removal focus module in Chromium
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
          TENANTS_BROWSER_BUILD_CONFIGURATION: Release
        run: tests/Hexalith.Tenants.UI.Tests/Browser/validate-tenants-focus-browser.sh
