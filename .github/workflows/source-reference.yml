name: Source-reference integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: source-reference-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  projection-provenance:
    name: Projection provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize root-declared submodules
        run: git -c submodule.recurse=false submodule update --init
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the source-reference integration graph
        run: >
          dotnet build tests/Hexalith.Tenants.IntegrationTests/Hexalith.Tenants.IntegrationTests.csproj
          --configuration Debug -p:UseHexalithProjectReferences=true -warnaserror -m:1 -nr:false --no-incremental
      - name: Verify real-handler projection provenance
        run: >
          dotnet tests/Hexalith.Tenants.IntegrationTests/bin/Debug/net10.0/Hexalith.Tenants.IntegrationTests.dll
          -noLogo -noColor -parallelMode none
          -method Hexalith.Tenants.IntegrationTests.TenantsApiGeneratedControllerTests.GlobalAdministratorsRealHandlerMetadataSurvivesRouterRestClientAndUiGateway
