name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC — runs Performance tests

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAPR_VERSION: '1.17.0'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # semantic-release needs full history
          submodules: true

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore Hexalith.Tenants.slnx

      - name: Build
        run: dotnet build Hexalith.Tenants.slnx --no-restore --configuration Release -warnaserror

      - name: Unit Tests (Tier 1)
        run: |
          dotnet test tests/Hexalith.Tenants.Contracts.Tests/ --no-build --configuration Release --logger "trx;LogFileName=contracts-results.trx" --results-directory TestResults/contracts --collect:"XPlat Code Coverage"
          dotnet test tests/Hexalith.Tenants.Client.Tests/ --no-build --configuration Release --logger "trx;LogFileName=client-results.trx" --results-directory TestResults/client --collect:"XPlat Code Coverage"
          dotnet test tests/Hexalith.Tenants.Testing.Tests/ --no-build --configuration Release --logger "trx;LogFileName=testing-results.trx" --results-directory TestResults/testing --collect:"XPlat Code Coverage"
          dotnet test samples/Hexalith.Tenants.Sample.Tests/ --no-build --configuration Release --logger "trx;LogFileName=sample-results.trx" --results-directory TestResults/sample --collect:"XPlat Code Coverage"

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@8d980918fd43a2765c143ce7f687665b2d46a6b9 # v2
        with:
          version: ${{ env.DAPR_VERSION }}

      - name: Initialize Dapr
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: dapr init

      - name: Integration Tests (Tier 2)
        run: dotnet test tests/Hexalith.Tenants.Server.Tests/ --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx" --results-directory TestResults/server --collect:"XPlat Code Coverage"

      - name: Validate coverage gates
        run: >
          python3 scripts/validate-coverage.py
          --coverage-root TestResults
          --minimum-line-coverage 80
          --required-branch-coverage 100
          --isolation-auth-target src/Hexalith.Tenants.Server/Aggregates/TenantAggregate.cs
          --isolation-auth-target src/Hexalith.Tenants.Server/Aggregates/GlobalAdministratorsAggregate.cs
          --isolation-auth-target src/Hexalith.Tenants.Server/Validators/ChangeUserRoleValidator.cs
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blocking-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          retention-days: 7

  aspire-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore and Build
        run: |
          dotnet restore Hexalith.Tenants.slnx
          dotnet build Hexalith.Tenants.slnx --no-restore --configuration Release -warnaserror

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@8d980918fd43a2765c143ce7f687665b2d46a6b9 # v2
        with:
          version: ${{ env.DAPR_VERSION }}

      - name: Initialize Dapr
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: dapr init

      - name: Aspire Contract Tests (Tier 3, non-Performance)
        run: >
          dotnet test
          tests/Hexalith.Tenants.IntegrationTests/
          --no-build --configuration Release
          --filter "Category!=Performance"
          --logger "trx;LogFileName=aspire-results.trx"
          --results-directory TestResults/aspire
          --collect:"XPlat Code Coverage"

      - name: Test Summary
        if: always()
        run: |
          echo "## Tier 3 Aspire Contract Tests" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aspire-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          retention-days: 7

  performance-tests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-and-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore and Build
        run: |
          dotnet restore Hexalith.Tenants.slnx
          dotnet build Hexalith.Tenants.slnx --no-restore --configuration Release -warnaserror

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@8d980918fd43a2765c143ce7f687665b2d46a6b9 # v2
        with:
          version: ${{ env.DAPR_VERSION }}

      - name: Initialize Dapr
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: dapr init

      - name: Performance Tests (Tier 3, nightly only)
        run: >
          dotnet test
          tests/Hexalith.Tenants.IntegrationTests/
          --no-build --configuration Release
          --filter "Category=Performance"
          --logger "trx;LogFileName=perf-results.trx"
          --results-directory TestResults/performance

      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-test-results
          path: "TestResults/**/*.trx"
          retention-days: 7
