name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC — runs Performance tests

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@e3be295557d7d7d6009ea2dc207084b20384e740
    with:
      solution: Hexalith.Tenants.slnx
      dapr-version: '1.17.0'
      run-consumer-validation: true
      run-coverage-gate: true
      unit-test-projects: |
        tests/Hexalith.Tenants.Contracts.Tests
        tests/Hexalith.Tenants.Client.Tests
        tests/Hexalith.Tenants.Testing.Tests
        tests/Hexalith.Tenants.UI.Tests
        samples/Hexalith.Tenants.Sample.Tests
      integration-test-projects: |
        tests/Hexalith.Tenants.Server.Tests
      aspire-test-project: tests/Hexalith.Tenants.IntegrationTests
      coverage-minimum-line: 80
      coverage-required-branch: 100
      coverage-isolation-targets: |
        src/Hexalith.Tenants.Server/Aggregates/TenantAggregate.cs
        src/Hexalith.Tenants.Server/Aggregates/GlobalAdministratorsAggregate.cs
        src/Hexalith.Tenants.Server/Validators/ChangeUserRoleValidator.cs
