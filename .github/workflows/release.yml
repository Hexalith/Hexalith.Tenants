name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-release.yml@e3be295557d7d7d6009ea2dc207084b20384e740
    with:
      solution: Hexalith.Tenants.slnx
      dapr-version: '1.18.0'
      test-projects: |
        tests/Hexalith.Tenants.Contracts.Tests
        tests/Hexalith.Tenants.Client.Tests
        tests/Hexalith.Tenants.Testing.Tests
        tests/Hexalith.Tenants.UI.Tests
        samples/Hexalith.Tenants.Sample.Tests
        tests/Hexalith.Tenants.Server.Tests
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
