name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-release.yml@main
    with:
      solution: Hexalith.Tenants.slnx
      dapr-version: '1.18.0'
      publish-containers: true
      container-projects: |
        src/Hexalith.Tenants/Hexalith.Tenants.csproj|tenants
      test-projects: |
        tests/Hexalith.Tenants.Contracts.Tests
        tests/Hexalith.Tenants.Client.Tests
        tests/Hexalith.Tenants.Testing.Tests
        tests/Hexalith.Tenants.UI.Tests
        samples/Hexalith.Tenants.Sample.Tests
        tests/Hexalith.Tenants.Server.Tests
    secrets: inherit
