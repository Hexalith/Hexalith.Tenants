name: Release

# Publication is an explicit operator action. The unprotected preflight proves the
# dispatch selected the current main tip and that exact source already has a successful
# push CI run before the protected release environment is entered. Ordinary pushes and
# pull requests run CI only (see Hexalith.Builds ci-cd-standards.md, "Release Gates").
on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact green main source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require current main with successful exact-source CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatch source must be an exact lowercase commit SHA." >&2
            exit 1
          fi

          live_main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$live_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The live main SHA could not be resolved safely." >&2
            exit 1
          fi
          if [ "$DISPATCH_SHA" != "$live_main_sha" ]; then
            echo "The dispatched source is no longer the live main tip." >&2
            exit 1
          fi

          ci_runs="$(gh api --method GET \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$DISPATCH_SHA" \
            -f status=success \
            -f per_page=100)"
          if ! printf '%s\n' "$ci_runs" | jq -e --arg sha "$DISPATCH_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | length > 0
          ' >/dev/null; then
            echo "No successful push CI run exists for the exact current main SHA." >&2
            exit 1
          fi

  release:
    needs: verify-source
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    # domain-release.yml enforces a supply-chain identity check: the reusable workflow
    # must be pinned to an exact 40-hex Builds commit and the caller must pass
    # builds-execution-sha equal to that same SHA (the reusable job validates
    # job.workflow_sha == builds-execution-sha). A missing or mismatched input is a
    # workflow startup_failure. @main cannot be used: main advances, so job.workflow_sha
    # would drift out of match. Replace both occurrences together.
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-release.yml@5041efefd95be9c9a539d39c7e312316bbb59a2d
    with:
      solution: Hexalith.Tenants.slnx
      timeout-minutes: 60
      environment-name: production
      publish-containers: true
      builds-execution-sha: 5041efefd95be9c9a539d39c7e312316bbb59a2d
      source-branch: main
      source-ci-workflow: ci.yml
      package-manifest: tools/release-packages.json
      expected-package-count: 5
      # CI (the verify-source gate above) already tested this exact head; leave
      # test-projects empty so the release path does not duplicate the test compute.
      test-projects: ''
      container-projects: |
        src/Hexalith.Tenants/Hexalith.Tenants.csproj|tenants
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
      HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}

  verify-publication:
    name: Verify exact source was published
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require published release for exact dispatched source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatched release source must be an exact lowercase commit SHA." >&2
            exit 1
          fi

          releases="$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" | jq -s '.')"
          if ! printf '%s\n' "$releases" | jq -e '
            type == "array" and
            all(.[]; type == "array") and
            all(.[][];
              type == "object" and
              (.draft | type == "boolean") and
              (.tag_name | type == "string") and
              (.tag_name | length > 0)
            )
          ' >/dev/null; then
            echo "The GitHub Releases response could not be validated safely." >&2
            exit 1
          fi

          published_tags="$(printf '%s\n' "$releases" | jq -r '.[][] | select(.draft == false) | .tag_name')"
          matching_tag=''
          while IFS= read -r tag_name; do
            [ -n "$tag_name" ] || continue
            encoded_tag="$(jq -rn --arg tag "$tag_name" '$tag | @uri')"
            if ! tag_sha="$(gh api "repos/${REPOSITORY}/commits/${encoded_tag}" --jq '.sha')"; then
              echo "The commit for published release tag '${tag_name}' could not be resolved." >&2
              exit 1
            fi
            if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Published release tag '${tag_name}' did not resolve to an exact lowercase commit SHA." >&2
              exit 1
            fi
            if [ "$tag_sha" = "$DISPATCH_SHA" ]; then
              matching_tag="$tag_name"
              break
            fi
          done <<< "$published_tags"

          if [ -z "$matching_tag" ]; then
            echo "No published GitHub Release tag resolves to dispatched SHA ${DISPATCH_SHA}. Redispatch Release from the current main tip after exact-source CI succeeds." >&2
            exit 1
          fi
          echo "Published release tag '${matching_tag}' resolves to dispatched SHA ${DISPATCH_SHA}."
