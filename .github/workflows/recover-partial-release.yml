name: Recover Partial Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing partially published SemVer, for example 3.3.0'
        required: true
        type: string
      source_sha:
        description: 'Exact live main SHA that produced the partial release'
        required: true
        type: string

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    # NuGet.org publishes through Trusted Publishing; see release.yml. This workflow needs its own
    # nuget.org policy: Hexalith / Hexalith.Tenants / recover-partial-release.yml / production.
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Resolve approved Builds execution from the source publication workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYIDENTITY'
          import os, re
          from pathlib import Path
          def approved_builds_sha(workflow):
              """Read literal environment declarations from a closed indentation-based YAML subset."""
              stack = []
              values = []
              environments = set()
              mapping_keys = set()
              block_indent = None
              step_number = 0
              active_steps = set()
              for raw in workflow.splitlines():
                  if not raw.strip() or raw.lstrip().startswith('#'):
                      continue
                  indent = len(raw) - len(raw.lstrip(' '))
                  if '\t' in raw[:len(raw) - len(raw.lstrip())]:
                      raise ValueError('source workflow uses unsupported tab indentation')
                  if block_indent is not None:
                      if indent > block_indent:
                          continue
                      block_indent = None
                  line = raw[indent:]
                  sequence = line.startswith('- ')
                  if sequence:
                      line = line[2:]
                      indent += 2
                      step_number += 1
                  while stack and stack[-1][0] >= indent:
                      stack.pop()
                  match = re.fullmatch(r'([A-Za-z_][A-Za-z0-9_-]*):(?:[ ]+(.*))?', line)
                  if match is None:
                      raise ValueError('source workflow uses an unsupported mapping shape')
                  key, value = match.groups()
                  value = (value or '').split(' #', 1)[0].strip()
                  path = [item[1] for item in stack]
                  if stack:
                      expected_indent = stack[-1][0] + (4 if path[-1] == 'steps' else 2)
                      if indent != expected_indent:
                          raise ValueError('source workflow uses unsupported mapping indentation')
                  if sequence:
                      if len(path) != 3 or path[0] != 'jobs' or path[-1] != 'steps':
                          raise ValueError('source workflow uses an unsupported sequence')
                      active_steps.add(tuple(path))
                  if path and path[-1] == 'steps' and tuple(path) not in active_steps:
                      raise ValueError('source workflow steps must be a sequence')
                  context = tuple(path) + ((step_number,) if 'steps' in path else ())
                  coordinate = context + (key,)
                  if coordinate in mapping_keys:
                      raise ValueError('source workflow has duplicate mapping keys')
                  mapping_keys.add(coordinate)
                  if (key in ('env', 'jobs', 'steps') or path == ['jobs']) and value:
                      raise ValueError('source workflow uses an unsupported structural mapping: ' + key)
                  if key == 'env':
                      valid = not path or (len(path) == 2 and path[0] == 'jobs') or (
                          len(path) == 3 and path[0] == 'jobs' and path[2] == 'steps')
                      context = tuple(path) + ((step_number,) if 'steps' in path else ())
                      if not valid or context in environments:
                          raise ValueError('source workflow has an ambiguous environment declaration')
                      environments.add(context)
                  if path and path[-1] == 'env':
                      if indent != stack[-1][0] + 2 or key == '<<':
                          raise ValueError('source workflow has an unsupported environment declaration')
                      if key == 'HEXALITH_BUILDS_EXECUTION_SHA':
                          if value.startswith(("'", '"')) and value.endswith(value[0]):
                              value = value[1:-1]
                          if not re.fullmatch(r'[0-9a-f]{40}', value):
                              raise ValueError('source workflow must approve an exact literal Builds SHA')
                          values.append(value)
                  if value.startswith(('|', '>')):
                      block_indent = indent
                  elif not value:
                      stack.append((indent, key))
              if not values or len(set(values)) != 1:
                  raise ValueError('source release workflow must declare one consistent exact Builds execution SHA')
              return values[0]
          approved = approved_builds_sha(Path('.github/workflows/release.yml').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('HEXALITH_BUILDS_EXECUTION_SHA=' + approved + '\n')
          PYIDENTITY
      - name: Check out approved Builds execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.Builds
          ref: ${{ env.HEXALITH_BUILDS_EXECUTION_SHA }}
          path: .hexalith/builds-execution
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify standalone recovery workflow closure
        uses: ./.hexalith/builds-execution/Github/governed-provenance
        with:
          workflow-mode: standalone
          stage: release
          builds-execution-sha: ${{ env.HEXALITH_BUILDS_EXECUTION_SHA }}
          workflow-path: .github/workflows/recover-partial-release.yml
          candidate: ${{ inputs.source_sha }}
          output: .hexalith/recovery-workflow-provenance.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - name: Initialize root-declared build submodule
        run: git submodule update --init references/Hexalith.Builds
      - name: Validate partial release state
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_VERSION: ${{ inputs.version }}
          RECOVERY_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_SHA: ${{ inputs.source_sha }}
          HEXALITH_RELEASE_ENVIRONMENT: production
          HEXALITH_RELEASE_SOURCE_BRANCH: main
          HEXALITH_RELEASE_SOURCE_CI_WORKFLOW: ci.yml
          HEXALITH_RELEASE_EXPECTED_PACKAGE_COUNT: 5
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}
        run: bash scripts/validate-partial-release-recovery.sh "$RECOVERY_VERSION" "$RECOVERY_SOURCE_SHA"
      - name: Prepare recovery packages
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_VERSION: ${{ inputs.version }}
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: bash scripts/prepare-partial-release.sh "$RECOVERY_VERSION"
      - name: Require the Trusted Publishing account
        if: steps.recovery.outputs.needs-nuget == 'true'
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_USER//[[:space:]]/}" ]; then
            echo "The repository variable NUGET_USER must name the individual nuget.org account that created the Trusted Publishing policy." >&2
            exit 1
          fi
      - name: Exchange GitHub OIDC token for a temporary NuGet key
        if: steps.recovery.outputs.needs-nuget == 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish missing release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_VERSION: ${{ inputs.version }}
          RECOVERY_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_SHA: ${{ inputs.source_sha }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}
          HEXALITH_CONTAINER_PROJECTS: src/Hexalith.Tenants/Hexalith.Tenants.csproj|tenants
        run: bash scripts/publish-partial-release.sh "$RECOVERY_VERSION"
      - name: Verify completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_VERSION: ${{ inputs.version }}
          RECOVERY_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_SHA: ${{ inputs.source_sha }}
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}
        run: bash scripts/verify-partial-release.sh "$RECOVERY_VERSION"
      - name: Upload recovery destination evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .hexalith/recovery/**
            .hexalith/recovery-workflow-provenance.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
