apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: resiliency
spec:
  policies:
    retries:
      # An explicit app target also bypasses Dapr's built-in service invocation retries.
      noReadRetry:
        policy: constant
        duration: 1ms
        maxRetries: 0
      defaultRetry:
        policy: constant
        duration: 1s
        maxRetries: 3
      pubsubRetryOutbound:
        policy: exponential
        maxInterval: 10s
        maxRetries: 3
      pubsubRetryInbound:
        policy: exponential
        maxInterval: 30s
        maxRetries: 10
    timeouts:
      daprSidecar: 5s
      # App-wide EventStore invocation limit, including commands, reads and readiness.
      eventStoreInvocation: 30s
      pubsubTimeout: 10s
      subscriberTimeout: 30s
    circuitBreakers:
      defaultBreaker:
        maxRequests: 1
        interval: 10s
        timeout: 30s
        trip: consecutiveFailures > 3
      pubsubBreaker:
        maxRequests: 1
        interval: 10s
        timeout: 30s
        trip: consecutiveFailures > 5
  targets:
    apps:
      tenants-api:
        retry: noReadRetry
        timeout: daprSidecar
      eventstore:
        retry: defaultRetry
        timeout: eventStoreInvocation
        circuitBreaker: defaultBreaker
      tenants:
        retry: defaultRetry
        timeout: daprSidecar
        circuitBreaker: defaultBreaker
    components:
      pubsub:
        outbound:
          retry: pubsubRetryOutbound
          timeout: pubsubTimeout
          circuitBreaker: pubsubBreaker
        inbound:
          retry: pubsubRetryInbound
          timeout: subscriberTimeout
      statestore:
        retry: defaultRetry
        timeout: daprSidecar
        circuitBreaker: defaultBreaker
