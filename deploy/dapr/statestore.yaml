# DAPR State Store Component -- Production Template
# =================================================
# Redis-backed state store for EventStore aggregate actor state, Tenants projections,
# command status, admin diagnostics, and the Tenants Data Protection key ring that backs
# the opaque query pagination cursor codec (see deploy/dapr/README.md, EventStore:DataProtection).
# The selected DAPR state store must support ETag / first-write concurrency for key-ring
# compare-and-swap writes. The Tenants ring uses the application-specific state key
# `hexalith-tenants-dataprotection-keys`; keep this component scoped only to trusted app IDs.
#
# Component contract:
#   name: statestore
#   actorStateStore: "true"
#   scopes: eventstore, tenants, eventstore-admin
#
# Replace placeholders through your platform secret/environment mechanism before deployment.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "{env:TENANTS_REDIS_HOST}"
    - name: redisPassword
      value: "{secretKeyRef:tenants-redis-password}"
    - name: enableTLS
      value: "{env:TENANTS_REDIS_ENABLE_TLS|true}"
    - name: actorStateStore
      value: "true"
scopes:
  - eventstore
  - tenants
  - eventstore-admin
