# DAPR Pub/Sub Component -- Production Template
# =============================================
# Redis-backed pub/sub template for tenant domain events. Provider choice belongs in
# this component YAML; Tenants domain packages must not depend on Redis, brokers, or
# cloud-provider SDKs.
#
# Component contract:
#   name: pubsub
#   event topic: tenants.events
#   dead-letter topic: deadletter.tenants.events (produced by EventStore's
#     application-level dead-letter publisher on command-processing failure --
#     NOT DAPR component metadata; DAPR's native DLQ is a per-subscription setting)
#   component scopes: eventstore and sample can use this component
#   topic scopes:
#     - eventstore publishes tenants.events and deadletter.tenants.events
#     - sample cannot publish to this component
#     - sample subscribes to tenants.events
#
# Replace placeholders through your platform secret/environment mechanism before deployment.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "{env:TENANTS_REDIS_HOST}"
    - name: redisPassword
      value: "{secretKeyRef:tenants-redis-password}"
    - name: enableTLS
      value: "{env:TENANTS_REDIS_ENABLE_TLS|true}"
    - name: publishingScopes
      value: "eventstore=tenants.events,deadletter.tenants.events;sample="
    - name: subscriptionScopes
      value: "sample=tenants.events"
scopes:
  - eventstore
  - sample
