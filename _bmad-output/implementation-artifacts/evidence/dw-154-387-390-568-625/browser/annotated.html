const culture=new URL(location.href).searchParams.get('culture')||'en';
document.documentElement.lang=culture;
window.expected=["ops admin", "ops\\{U+00A0}admin", "ops\\{U+202F}admin", "ops\\{U+2009}admin", "ops\\\\{U+00A0}admin"];window.literal=["ops admin", "ops\u00a0admin", "ops\u202fadmin", "ops\u2009admin", "ops\\{U+00A0}admin"];
try{
 const fluent=await import('./fluent-ui.js');fluent.beforeStart(document,'web');await customElements.whenDefined('fluent-button');
