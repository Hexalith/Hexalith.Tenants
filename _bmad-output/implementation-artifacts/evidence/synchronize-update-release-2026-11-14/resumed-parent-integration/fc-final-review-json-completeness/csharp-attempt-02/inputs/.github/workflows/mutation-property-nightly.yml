name: Mutation and Property Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-property-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-tools-mutation-segment:
    name: SourceTools mutation (${{ matrix.segment }})
    strategy:
      fail-fast: false
      matrix:
        segment: [happy-path, error-handling]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk@sha256:7913685c883a29dd8ba79da96172f5c6b29ed9be706ebe95935e3ef45f19c9c1
      # Each segment retains two test servers within the runner's four available CPUs.
      options: --cpus=4 --memory=10g --memory-swap=10g
    defaults:
      run:
        shell: bash
    env:
      UseMicrosoftTestingPlatformRunner: 'true'
      DOTNET_PROCESSOR_COUNT: '2'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          # Root-declared references submodules only; never initialize nested submodules recursively.
          submodules: false

      - name: Prepare mutation container prerequisites and cache
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 patch
          test -n "$HOME"
          mutation_packages="$HOME/.nuget/packages"
          mkdir -p "$mutation_packages"
          printf 'NUGET_PACKAGES=%s\n' "$mutation_packages" >> "$GITHUB_ENV"
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.swap.max /sys/fs/cgroup/cpu.max

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@6e77e79e8914a375b0c43b0af3bd142405675ecd
        with:
          dotnet-version: '11.0.100'

      - name: Install .NET 11 runtimes
        shell: pwsh
        run: ./eng/install-net11-runtime.ps1

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore Hexalith.FrontComposer.slnx -p:Configuration=Release

      - name: Build authenticated private mutation tool
        run: python3 eng/stryker_compat.py prepare

      - name: Build SourceTools tests
        run: dotnet build tests/Hexalith.FrontComposer.SourceTools.Tests/Hexalith.FrontComposer.SourceTools.Tests.csproj --configuration Release --no-restore

      - name: Run complete mutation segment
        working-directory: src/Hexalith.FrontComposer.SourceTools
        run: >-
          python3 ../../eng/trace-mutation-run.py --
          python3 ../../eng/stryker_compat.py run ${{ matrix.segment }}

      - name: Verify segment private-tool provenance
        if: always()
        run: python3 eng/stryker_compat.py verify ${{ matrix.segment }}

      - name: Prepare segment artifacts for publication
        id: publication
        if: always()
        shell: pwsh
        run: ./eng/prepare-mutation-artifacts.ps1 -Segment ${{ matrix.segment }}

      - name: Upload segment reports and provenance
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-source-tools-${{ matrix.segment }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/mutation/${{ matrix.segment }}/**/reports/source-tools-${{ matrix.segment }}.json
            artifacts/mutation/${{ matrix.segment }}/**/reports/source-tools-${{ matrix.segment }}.html
            artifacts/mutation/${{ matrix.segment }}/tool-provenance.json
            artifacts/mutation/${{ matrix.segment }}/publication-digests.json

  source-tools-mutation:
    name: source-tools-mutation
    needs: source-tools-mutation-segment
    if: always()
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk@sha256:7913685c883a29dd8ba79da96172f5c6b29ed9be706ebe95935e3ef45f19c9c1
      # Rebuild and verify in the same pinned preparation environment as both segments.
      options: --cpus=4 --memory=10g --memory-swap=10g
    defaults:
      run:
        shell: bash
    env:
      UseMicrosoftTestingPlatformRunner: 'true'
      DOTNET_PROCESSOR_COUNT: '2'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          # Root-declared references submodules only; never initialize nested submodules recursively.
          submodules: false

      - name: Prepare mutation container prerequisites and cache
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 patch
          test -n "$HOME"
          mutation_packages="$HOME/.nuget/packages"
          mkdir -p "$mutation_packages"
          printf 'NUGET_PACKAGES=%s\n' "$mutation_packages" >> "$GITHUB_ENV"
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.swap.max /sys/fs/cgroup/cpu.max

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@6e77e79e8914a375b0c43b0af3bd142405675ecd
        with:
          dotnet-version: '11.0.100'

      - name: Install .NET 11 runtimes
        shell: pwsh
        run: ./eng/install-net11-runtime.ps1

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore Hexalith.FrontComposer.slnx -p:Configuration=Release

      - name: Build authenticated private mutation tool
        run: python3 eng/stryker_compat.py prepare

      - name: Build SourceTools tests
        run: dotnet build tests/Hexalith.FrontComposer.SourceTools.Tests/Hexalith.FrontComposer.SourceTools.Tests.csproj --configuration Release --no-restore

      - name: Download Happy-path reports and provenance
        if: always()
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mutation-source-tools-happy-path
          path: artifacts/mutation/happy-path

      - name: Download Error-handling reports and provenance
        if: always()
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mutation-source-tools-error-handling
          path: artifacts/mutation/error-handling

      - name: Verify worker publication digest bindings
        if: always()
        shell: pwsh
        run: ./eng/prepare-mutation-artifacts.ps1 -VerifyPublishedInputs

      - name: Validate mutation reports
        if: always()
        shell: pwsh
        run: ./eng/validate-stryker-reports.ps1 -RequireCompatibilityProvenance

      - name: Validate finite mutation identities and statuses
        if: always()
        run: python3 eng/check-mutation-triage.py

      - name: Require both complete segment jobs to succeed
        if: always()
        env:
          SEGMENT_RESULT: ${{ needs.source-tools-mutation-segment.result }}
        run: test "$SEGMENT_RESULT" = success

      - name: Prepare aggregate artifacts for publication
        id: publication
        if: always()
        shell: pwsh
        run: ./eng/prepare-mutation-artifacts.ps1

      - name: Mutation Summary
        if: always() && steps.publication.outcome == 'success'
        shell: bash
        run: |
          if [ -f artifacts/mutation/job-summary.md ]; then
            cat artifacts/mutation/job-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutation artifacts
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-source-tools-artifacts
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/mutation/happy-path/**/reports/source-tools-happy-path.json
            artifacts/mutation/happy-path/**/reports/source-tools-happy-path.html
            artifacts/mutation/happy-path/tool-provenance.json
            artifacts/mutation/happy-path/publication-digests.json
            artifacts/mutation/error-handling/**/reports/source-tools-error-handling.json
            artifacts/mutation/error-handling/**/reports/source-tools-error-handling.html
            artifacts/mutation/error-handling/tool-provenance.json
            artifacts/mutation/error-handling/publication-digests.json
            artifacts/mutation/job-summary.md
            artifacts/mutation/mutation-report-audit.json
            artifacts/mutation/publication-input-audit.json
            artifacts/mutation/mutation-triage-admission.json
            artifacts/mutation/mutation-validation-errors.txt

  lifecycle-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          # Root-level submodules only; never initialize nested submodules recursively.
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@6e77e79e8914a375b0c43b0af3bd142405675ecd
        with:
          dotnet-version: '11.0.100'

      - name: Install .NET 11 runtimes
        shell: pwsh
        run: ./eng/install-net11-runtime.ps1

      - name: Restore packages
        run: dotnet restore Hexalith.FrontComposer.slnx

      - name: Run high-count lifecycle property suite
        shell: pwsh
        run: ./eng/run-lifecycle-property-suite.ps1 -MaxTest 10000 -ResultsDirectory "TestResults/property-nightly"

      - name: Validate property artifacts
        if: always()
        shell: pwsh
        run: ./eng/validate-property-artifacts.ps1

      - name: Property Summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/property/job-summary.md ]; then
            cat artifacts/property/job-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload property artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-property-artifacts
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/property/**
            TestResults/property-nightly/**
