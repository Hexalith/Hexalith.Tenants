name: Mutation and Property Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-property-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-tools-mutation:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk@sha256:7913685c883a29dd8ba79da96172f5c6b29ed9be706ebe95935e3ef45f19c9c1
      # Both two-thread mutation workers share the public runner's four available CPUs.
      options: --cpus=4 --memory=10g --memory-swap=10g
    defaults:
      run:
        shell: bash
    env:
      UseMicrosoftTestingPlatformRunner: 'true'
      DOTNET_PROCESSOR_COUNT: '2'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          # Root-declared references submodules only; never initialize nested submodules recursively.
          submodules: false

      - name: Prepare mutation container prerequisites and cache
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 patch
          test -n "$HOME"
          mutation_packages="$HOME/.nuget/packages"
          mkdir -p "$mutation_packages"
          printf 'NUGET_PACKAGES=%s\n' "$mutation_packages" >> "$GITHUB_ENV"
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.swap.max /sys/fs/cgroup/cpu.max

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@6e77e79e8914a375b0c43b0af3bd142405675ecd
        with:
          dotnet-version: '11.0.100'

      - name: Install .NET 11 runtimes
        shell: pwsh
        run: ./eng/install-net11-runtime.ps1

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore Hexalith.FrontComposer.slnx -p:Configuration=Release

      - name: Build authenticated private mutation tool
        run: python3 eng/stryker_compat.py prepare

      - name: Build SourceTools tests
        run: dotnet build tests/Hexalith.FrontComposer.SourceTools.Tests/Hexalith.FrontComposer.SourceTools.Tests.csproj --configuration Release --no-restore

      - name: Happy-path mutation segment
        working-directory: src/Hexalith.FrontComposer.SourceTools
        run: >-
          python3 ../../eng/trace-mutation-run.py --
          python3 ../../eng/stryker_compat.py run happy-path

      - name: Error-handling mutation segment
        if: always()
        working-directory: src/Hexalith.FrontComposer.SourceTools
        run: >-
          python3 ../../eng/trace-mutation-run.py --
          python3 ../../eng/stryker_compat.py run error-handling

      - name: Validate mutation reports
        if: always()
        shell: pwsh
        run: ./eng/validate-stryker-reports.ps1 -RequireCompatibilityProvenance

      - name: Mutation Summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/mutation/job-summary.md ]; then
            cat artifacts/mutation/job-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-source-tools-artifacts
          retention-days: 14
          if-no-files-found: error
          path: artifacts/mutation/**

  lifecycle-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          # Root-level submodules only; never initialize nested submodules recursively.
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@6e77e79e8914a375b0c43b0af3bd142405675ecd
        with:
          dotnet-version: '11.0.100'

      - name: Install .NET 11 runtimes
        shell: pwsh
        run: ./eng/install-net11-runtime.ps1

      - name: Restore packages
        run: dotnet restore Hexalith.FrontComposer.slnx

      - name: Run high-count lifecycle property suite
        shell: pwsh
        run: ./eng/run-lifecycle-property-suite.ps1 -MaxTest 10000 -ResultsDirectory "TestResults/property-nightly"

      - name: Validate property artifacts
        if: always()
        shell: pwsh
        run: ./eng/validate-property-artifacts.ps1

      - name: Property Summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/property/job-summary.md ]; then
            cat artifacts/property/job-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload property artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-property-artifacts
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/property/**
            TestResults/property-nightly/**
